<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101923">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memoria">
<title>Memoria V3</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#101923;--panel:#172431;--yellow:#ffc83d;--ink:#f8fafb;--muted:#9bacb9;--green:#64d47c;--purple:#7b43d6;--line:#304657}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:linear-gradient(#0d1720,#142534);color:var(--ink)}
body{min-height:100dvh}button{font:inherit}.app{max-width:720px;margin:auto;padding:calc(15px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.on{display:block}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.title{font-size:34px;font-weight:950;letter-spacing:-1px}.sub{font-size:12px;color:var(--muted);font-weight:700}
.icon{border:1px solid var(--line);background:var(--panel);color:white;border-radius:14px;padding:10px 12px;box-shadow:0 5px 14px #0003}
.hero{min-height:72dvh;display:flex;flex-direction:column;justify-content:center;text-align:center}.brain{font-size:72px}.hero h1{font-size:48px;margin:4px 0 0;letter-spacing:-2px}.hero p{color:var(--muted);font-weight:700;margin:5px 0 24px}
.primary{border:0;border-radius:17px;padding:16px 18px;font-weight:950;font-size:17px;background:var(--yellow);color:#15202a;box-shadow:0 8px 22px #0004}.secondary{border:1px solid var(--line);border-radius:17px;padding:14px 18px;font-weight:900;background:var(--panel);color:white;margin-top:10px}
.homeProgress{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:22px 0}.homeProgress div,.sum{background:var(--panel);border:1px solid #293e4e;border-radius:14px;padding:12px 5px;text-align:center}.homeProgress b,.sum b{display:block;font-size:22px}.homeProgress span,.sum span{font-size:9px;color:var(--muted);font-weight:850}
.badge{display:inline-block;background:#213240;border:1px solid #3a5264;border-radius:999px;padding:6px 10px;margin-top:8px;font-size:12px;font-weight:850}
.challenge-banner{display:none;margin-top:8px;background:#21331f;border:1px solid #4e8150;border-radius:12px;padding:9px 10px;font-size:11px;font-weight:800}.challenge-banner.on{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 9px}.stat{background:var(--panel);border:1px solid #293e4e;border-radius:14px;padding:9px 3px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:8px;color:var(--muted);font-weight:900}
.progress{height:7px;background:#263847;border-radius:9px;overflow:hidden;margin-bottom:10px}.bar{height:100%;background:var(--yellow);width:0;transition:.2s}
.board{display:grid;gap:6px}.card{border:0;padding:0;background:transparent;aspect-ratio:1;perspective:700px}.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:.28s cubic-bezier(.2,.72,.2,1)}.card.flip .inner,.card.match .inner,.card.hint .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:11px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}.back{background:linear-gradient(135deg,#23394d,#111f2d);border:1px solid #60788b;box-shadow:0 4px 10px #0005}.back:after{content:"";position:absolute;inset:13%;border:1px solid #40586b;border-radius:8px}.front{transform:rotateY(180deg);background:#e9eef1;border:2px solid #e6edf1}.front img{width:100%;height:100%;object-fit:cover;display:block}.match .front{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}.hint .front{opacity:.38;filter:saturate(.55) brightness(1.12)}
.actions{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:6px;margin-top:11px}.act{border:0;border-radius:14px;padding:13px 5px;font-size:12px;font-weight:900;color:white;background:#1b2c3a}.act.h{background:var(--purple)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.lvl{position:relative;aspect-ratio:1;border:1px solid #34495b;background:var(--panel);color:white;border-radius:12px;font-weight:900}.lvl.lock{opacity:.3}.lvl.current{outline:2px solid var(--yellow)}.lvl.needs{border-color:#9b7130}.lvl small{position:absolute;bottom:4px;left:0;right:0;font-size:8px;letter-spacing:-1px;min-height:10px}
.filterRow{display:flex;gap:6px;overflow:auto;margin:10px 0}.filter{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:white;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:850}.filter.on{background:var(--yellow);color:#172431}
.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:center;justify-content:center;padding:18px}.overlay.on{display:flex}.modal{background:#152431;border:1px solid #3b5365;border-radius:24px;width:min(430px,100%);padding:22px;text-align:center;box-shadow:0 25px 70px #0008}.modal h2{font-size:28px;margin:6px}.stars{font-size:34px}.diamond{padding:9px;border:1px solid #8dc8ef;border-radius:12px;margin:10px 0}.challenge-result{display:none;padding:9px;border-radius:12px;margin:10px 0;font-weight:900}.challenge-result.win{display:block;background:#193a25;border:1px solid #4f9e68}.challenge-result.lose{display:block;background:#3b2b19;border:1px solid #9b774d}
.modalBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.modalBtns button,.shareBtn{border:0;border-radius:13px;padding:13px 6px;font-weight:900}.next{background:var(--yellow)}.again,.toLevels{background:#263847;color:white}.shareBtn{width:100%;margin-top:8px;background:#2c8d5d;color:white}
.toast{position:fixed;bottom:35px;left:50%;transform:translateX(-50%);background:#05090d;color:white;padding:10px 14px;border-radius:999px;display:none;z-index:9;font-size:12px;white-space:nowrap}
@media(max-width:390px){.app{padding-left:9px;padding-right:9px}.board{gap:5px}.face{border-radius:9px}.levels{gap:5px}.stat b{font-size:16px}.hero h1{font-size:43px}}
</style>
</head>
<body><main class="app">
<section id="homeScreen" class="screen on">
<div class="hero"><div class="brain">🧠</div><h1>MEMORIA</h1><p>Recuerda. Encuentra. Mejora.</p>
<div class="homeProgress"><div><b id="homeStars">0</b><span>ESTRELLAS</span></div><div><b id="homePerfect">0</b><span>PERFECTOS</span></div><div><b id="homeUnlocked">1</b><span>NIVELES</span></div></div>
<button id="play" class="primary">▶ Continuar</button><button id="choose" class="secondary">▦ Elegir nivel</button></div>
</section>

<section id="game" class="screen">
<header><div><div class="title">MEMORIA</div><div class="sub">Entrena tu memoria</div><div id="badge" class="badge"></div><div id="best" class="sub" style="margin-top:7px"></div><div id="challengeBanner" class="challenge-banner"></div></div>
<div><button class="icon" id="map">▦</button> <button class="icon" id="sound">🔊</button></div></header>
<div class="stats"><div class="stat"><b id="level">1</b><span>NIVEL</span></div><div class="stat"><b id="moves">0</b><span>MOVIMIENTOS</span></div><div class="stat"><b id="time">0:00</b><span>TIEMPO</span></div><div class="stat"><b id="streak">0🔥</b><span>RACHA</span></div></div>
<div class="progress"><div id="bar" class="bar"></div></div><div id="board" class="board"></div>
<div class="actions"><button id="restart" class="act">↻ Reiniciar</button><button id="hint" class="act h">💡 Pista · <span id="hints">3</span></button><button id="home" class="act">⌂ Inicio</button></div>
</section>

<section id="levelsScreen" class="screen">
<header><div><div class="title">NIVELES</div><div class="sub">Repite los que quieras mejorar</div></div><button id="close" class="icon">⌂</button></header>
<div class="summary"><div class="sum"><b id="sumStars">0</b><span>ESTRELLAS</span></div><div class="sum"><b id="sumDiamonds">0</b><span>PERFECTOS</span></div><div class="sum"><b id="sumUnlocked">1</b><span>DESBLOQUEADOS</span></div></div>
<div class="filterRow"><button class="filter on" data-filter="all">Todos</button><button class="filter" data-filter="zero">Sin estrellas</button><button class="filter" data-filter="improve">Por mejorar</button><button class="filter" data-filter="three">⭐⭐⭐</button></div>
<div id="levels" class="levels"></div>
</section></main>

<div id="overlay" class="overlay"><div class="modal"><div style="font-size:54px">🏆</div><h2 id="winTitle">¡Nivel completado!</h2><div id="stars" class="stars"></div><div id="diamond" class="diamond" style="display:none">💎 <b>¡MEMORIA PERFECTA!</b><br><small>Sin errores y sin pistas</small></div><div id="challengeResult" class="challenge-result"></div><p id="result"></p><p id="record" class="sub"></p>
<div class="modalBtns"><button id="again" class="again">Repetir</button><button id="toLevels" class="toLevels">Niveles</button><button id="next" class="next">Siguiente</button></div><button id="share" class="shareBtn">🤝 Retar a un amigo</button></div></div><div id="toast" class="toast"></div>

<script>
const TOTAL=100, KEY="memoriaV3Data", OLDKEY="memoriaV2FinalData";
const concepts=[
["cat","gato"],["dog","perro"],["airplane","avión"],["guitar","guitarra"],["soccer-ball","balón"],["red-apple","manzana"],
["bicycle","bicicleta"],["sunflower","girasol"],["car","automóvil"],["pizza","pizza"],["elephant","elefante"],["wristwatch","reloj"],
["strawberry","fresa"],["horse","caballo"],["train","tren"],["camera","cámara"],["hamburger","hamburguesa"],["panda","panda"],
["motorcycle","motocicleta"],["pineapple","piña"],["violin","violín"],["lion","león"],["sailboat","velero"],["basketball","baloncesto"],
["butterfly","mariposa"],["ice-cream","helado"],["tiger","tigre"],["tractor","tractor"],["parrot","loro"],["cupcake","pastel"]
].map((x,i)=>({id:x[0],label:x[1],url:`https://loremflickr.com/500/500/${x[0]}?lock=${310+i}`}));
let save=JSON.parse(localStorage.getItem(KEY)||"null");
if(!save){let old=JSON.parse(localStorage.getItem(OLDKEY)||"null");save=old||{unlocked:1,records:{}};localStorage.setItem(KEY,JSON.stringify(save))}
let current=Math.max(1,Math.min(TOTAL,Number(localStorage.getItem("memoryLevel")||1)));if(current>save.unlocked)current=save.unlocked;
let challenge=null;const qp=new URLSearchParams(location.search);if(qp.get("challenge")==="1"){const l=+qp.get("level"),m=+qp.get("moves"),t=+qp.get("time");if(l>=1&&l<=TOTAL&&m>0&&t>=0){challenge={level:l,moves:m,time:t,name:(qp.get("name")||"Un amigo").slice(0,30)};current=l}}
let deck=[],first=null,second=null,locked=false,moves=0,matched=0,streak=0,maxStreak=0,hints=3,errors=0,hintsUsed=0,start=null,timer=null,soundOn=true,lastResult=null,filter="all";
const $=id=>document.getElementById(id);
function cfg(n){let p;if(n<=10)p=6+Math.floor((n-1)/2);else if(n<=30)p=10+Math.floor((n-11)/4);else if(n<=60)p=15+Math.floor((n-31)/6);else p=20+Math.floor((n-61)/10);p=Math.min(24,p);let c=p<=7?3:p<=16?4:p<=20?5:6;return{p,c,three:Math.ceil(p*1.45),two:Math.ceil(p*2.05)}}
function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(s){return`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
function persist(){localStorage.setItem(KEY,JSON.stringify(save));if(!challenge)localStorage.setItem("memoryLevel",current)}
function tone(f){if(!soundOn)return;try{let c=new(AudioContext||webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.07);o.stop(c.currentTime+.07)}catch(e){}}
function show(id){["homeScreen","game","levelsScreen"].forEach(x=>$(x).classList.toggle("on",x===id));if(id==="homeScreen")homeStats();if(id==="levelsScreen")levels()}
function homeStats(){let ts=0,td=0;Object.values(save.records).forEach(r=>{ts+=r.stars||0;if(r.diamond)td++});$("homeStars").textContent=ts;$("homePerfect").textContent=td;$("homeUnlocked").textContent=save.unlocked}
function setup(){clearInterval(timer);first=second=null;locked=false;moves=matched=streak=maxStreak=errors=hintsUsed=0;hints=3;start=null;lastResult=null;$("moves").textContent=0;$("time").textContent="0:00";$("streak").textContent="0🔥";$("hints").textContent=hints;$("bar").style.width="0";$("overlay").classList.remove("on");let c=cfg(current);$("level").textContent=current;$("badge").textContent=`Nivel ${current} · ${c.p} parejas`;let r=save.records[current];$("best").textContent=r?`Mejor: ${r.moves} mov. · ${fmt(r.time)} · ${"⭐".repeat(r.stars)}`:"Aún sin récord";if(challenge&&challenge.level===current){$("challengeBanner").classList.add("on");$("challengeBanner").textContent=`🤝 Reto de ${challenge.name}: supera ${challenge.moves} movimientos · ${fmt(challenge.time)}`}else $("challengeBanner").classList.remove("on");$("board").style.gridTemplateColumns=`repeat(${c.c},1fr)`;
let chosen=sh([...concepts]).slice(0,c.p);deck=sh(chosen.flatMap(x=>[{...x},{...x}]));render()}
function render(){$("board").innerHTML="";deck.forEach((x,i)=>{let b=document.createElement("button");b.className="card";b.setAttribute("aria-label","Carta de "+x.label);b.innerHTML=`<span class="inner"><span class="face back"></span><span class="face front"><img src="${x.url}" alt="${x.label}" loading="eager"></span></span>`;b.onclick=()=>flip(b,i);$("board").appendChild(b)})}
function startClock(){if(start)return;start=Date.now();timer=setInterval(()=>$("time").textContent=fmt(Math.floor((Date.now()-start)/1000)),250)}
function flip(card,i){if(locked||card.classList.contains("flip")||card.classList.contains("match")||card.classList.contains("hint"))return;startClock();card.classList.add("flip");tone(520);if(!first){first={card,i};return}second={card,i};moves++;$("moves").textContent=moves;locked=true;if(deck[first.i].id===deck[second.i].id){setTimeout(()=>{first.card.classList.add("match");second.card.classList.add("match");first.card.classList.remove("flip");second.card.classList.remove("flip");matched++;streak++;maxStreak=Math.max(maxStreak,streak);$("streak").textContent=streak+"🔥";$("bar").style.width=(matched/cfg(current).p*100)+"%";if(streak>0&&streak%7===0){hints++;$("hints").textContent=hints;toast("🔥 Racha de 7: +1 pista")}first=second=null;locked=false;tone(820);if(matched===cfg(current).p)win()},250)}else{errors++;streak=0;$("streak").textContent="0🔥";setTimeout(()=>{first.card.classList.remove("flip");second.card.classList.remove("flip");first=second=null;locked=false;tone(230)},720)}}
function useHint(){if(locked||hints<1)return;let rem=[...document.querySelectorAll(".card")].map((c,i)=>({c,i})).filter(o=>!o.c.classList.contains("match"));if(!rem.length)return;hints--;hintsUsed++;$("hints").textContent=hints;let target=rem[Math.floor(Math.random()*rem.length)],id=deck[target.i].id,pair=rem.filter(o=>deck[o.i].id===id).slice(0,2);locked=true;pair.forEach(o=>o.c.classList.add("hint"));setTimeout(()=>{pair.forEach(o=>o.c.classList.remove("hint"));locked=false},2200)}
function beatChallenge(m,s){if(!challenge||challenge.level!==current)return null;return m<challenge.moves||(m===challenge.moves&&s<challenge.time)}
function win(){clearInterval(timer);let sec=Math.floor((Date.now()-start)/1000),c=cfg(current),stars=moves<=c.three?3:moves<=c.two?2:1;if(hintsUsed>0)stars=Math.min(stars,2);let perfect=errors===0&&hintsUsed===0,old=save.records[current],isRecord=!old||moves<old.moves||(moves===old.moves&&sec<old.time);let newBest={moves,time:sec,stars,diamond:perfect,maxStreak};if(old&&(old.moves<moves||(old.moves===moves&&old.time<=sec)))newBest={...old,stars:Math.max(old.stars||1,stars),diamond:!!old.diamond||perfect,maxStreak:Math.max(old.maxStreak||0,maxStreak)};else if(old){newBest.stars=Math.max(old.stars||1,stars);newBest.diamond=!!old.diamond||perfect;newBest.maxStreak=Math.max(old.maxStreak||0,maxStreak)}save.records[current]=newBest;save.unlocked=Math.max(save.unlocked,Math.min(TOTAL,current+1));persist();lastResult={level:current,moves,time:sec,stars,perfect};$("stars").textContent="⭐".repeat(stars)+"☆".repeat(3-stars);$("diamond").style.display=perfect?"block":"none";$("result").textContent=`${moves} movimientos · ${fmt(sec)} · racha máxima ${maxStreak}${hintsUsed?" · pista usada":""}`;$("record").textContent=isRecord?"🏅 Nuevo récord personal":`Récord: ${save.records[current].moves} mov. · ${fmt(save.records[current].time)}`;const beat=beatChallenge(moves,sec),cr=$("challengeResult");cr.className="challenge-result";if(beat===true){cr.classList.add("win");cr.textContent=`🏆 ¡Superaste el reto de ${challenge.name}!`;$("winTitle").textContent="¡Reto superado!"}else if(beat===false){cr.classList.add("lose");cr.textContent=`🤝 Te faltó superar la marca de ${challenge.name}`;$("winTitle").textContent="¡Nivel completado!"}else $("winTitle").textContent="¡Nivel completado!";setTimeout(()=>$("overlay").classList.add("on"),350)}
async function shareChallenge(){if(!lastResult)return;let name=localStorage.getItem("memoriaPlayerName")||"";if(!name){name=(prompt("¿Qué nombre quieres que vea tu amigo en el reto?","")||"Jugador").trim().slice(0,30);localStorage.setItem("memoriaPlayerName",name)}let u=new URL(location.href);u.search="";u.searchParams.set("challenge","1");u.searchParams.set("level",lastResult.level);u.searchParams.set("moves",lastResult.moves);u.searchParams.set("time",lastResult.time);u.searchParams.set("name",name);const text=`🧠 Te reto en MEMORIA: Nivel ${lastResult.level}. Mi marca: ${lastResult.moves} movimientos en ${fmt(lastResult.time)}. ¿Puedes superarla?`;try{if(navigator.share)await navigator.share({title:"Reto de Memoria",text,url:u.toString()});else{await navigator.clipboard.writeText(text+"\n"+u.toString());toast("Enlace del reto copiado")}}catch(e){}}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1800)}
function levels(){let g=$("levels");g.innerHTML="";let ts=0,td=0;Object.values(save.records).forEach(r=>{ts+=r.stars||0;if(r.diamond)td++});$("sumStars").textContent=ts;$("sumDiamonds").textContent=td;$("sumUnlocked").textContent=save.unlocked;for(let n=1;n<=TOTAL;n++){let r=save.records[n],lock=n>save.unlocked,showIt=filter==="all"||(filter==="zero"&&!r)||(filter==="improve"&&(!r||r.stars<3))||(filter==="three"&&r&&r.stars===3);if(!showIt)continue;let b=document.createElement("button");b.className="lvl"+(lock?" lock":"")+(n===current?" current":"")+(r&&r.stars<3?" needs":"");b.innerHTML=`${lock?"🔒":n}<small>${r?"⭐".repeat(r.stars)+"☆".repeat(3-r.stars)+(r.diamond?" 💎":""):"☆☆☆"}</small>`;if(!lock)b.onclick=()=>{challenge=null;current=n;persist();show("game");setup()};g.appendChild(b)}}
$("play").onclick=()=>{show("game");setup()};$("choose").onclick=()=>show("levelsScreen");$("hint").onclick=useHint;$("restart").onclick=setup;$("home").onclick=()=>{challenge=null;show("homeScreen")};$("map").onclick=()=>show("levelsScreen");$("close").onclick=()=>show("homeScreen");$("again").onclick=setup;$("toLevels").onclick=()=>{$("overlay").classList.remove("on");show("levelsScreen")};$("next").onclick=()=>{challenge=null;current=current===TOTAL?1:Math.min(save.unlocked,current+1);persist();setup()};$("share").onclick=shareChallenge;$("sound").onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?"🔊":"🔇"};document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("on"));b.classList.add("on");filter=b.dataset.filter;levels()});
homeStats();if(challenge){show("game");setup()}if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
